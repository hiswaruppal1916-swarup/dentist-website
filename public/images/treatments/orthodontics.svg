      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <filter id="cardGlow_ORTHODONTICSBRACES" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4F46E5" flood-opacity="0.18"/>
    </filter>
    <radialGradient id="mesh_ORTHODONTICSBRACES" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.25"/>
