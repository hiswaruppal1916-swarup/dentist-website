  </defs>
  
  <!-- Outer Card Canvas -->
  <rect width="480" height="320" rx="20" fill="url(#bgGrad_ORTHODONTICSBRACES)"/>
  <rect width="480" height="320" rx="20" fill="url(#mesh_ORTHODONTICSBRACES)"/>
  
  <!-- Ambient Graphic Rings -->
  <circle cx="410" cy="70" r="90" fill="#4F46E5" opacity="0.08"/>
  <circle cx="70" cy="250" r="110" fill="#001428" opacity="0.04"/>
  
  <!-- Central Sterile Medical Emblem Container -->
  <g filter="url(#cardGlow_ORTHODONTICSBRACES)">
    <rect x="135" y="45" width="210" height="185" rx="24" fill="#FFFFFF"/>
    <rect x="135" y="45" width="210" height="185" rx="24" fill="none" stroke="#4F46E5" stroke-width="1.5" stroke-opacity="0.2"/>
    <circle cx="240" cy="138" r="60" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
    <g transform="translate(192, 90) scale(2.0)">
      <path d="M12 24 C16 16, 34 16, 38 24" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round"/>
           <rect x="15" y="20" width="5" height="7" rx="1.5" fill="#0B2545"/>
